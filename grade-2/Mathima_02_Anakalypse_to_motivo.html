<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="Nikos Kalakos">
<meta name="copyright" content="© 2026 Nikos Kalakos">
<meta name="license" content="Original educational content and simulation design: CC BY-NC 4.0; source code © 2026 Nikos Kalakos; third-party and textbook materials excluded.">
<title>Μάθημα 2 - Ανακάλυψε το μοτίβο</title>
<style>
:root{
  --ink:#17324d;--blue:#147ca8;--blue2:#0b648b;--soft:#eaf7fb;
  --lime:#9abd22;--lime2:#789b12;--line:#c9d8e7;--ok:#2f9b63;
  --bad:#d85c4b;--yellow:#f3c84a;--shadow:0 10px 28px rgba(23,50,77,.12)
}
*{box-sizing:border-box}
body{margin:0;background:#f7fafc;color:var(--ink);font-family:Arial,"Noto Sans",sans-serif}
button{font:inherit;cursor:pointer}
.app{max-width:1160px;margin:auto;padding:16px}
.top{
  background:#fff;border:3px solid #b8dfea;border-radius:24px;padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)
}
.top h1{margin:0;font-size:clamp(28px,4vw,42px)}
.badge{
  width:68px;height:68px;border-radius:22px;background:var(--blue);
  display:grid;place-items:center;color:#fff;font-size:31px;font-weight:900
}
.path{display:flex;gap:10px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.dot{
  width:44px;height:44px;border-radius:50%;border:3px solid #aab9c9;background:#fff;color:#5e7389;
  display:grid;place-items:center;font-weight:900;font-size:20px
}
.dot.active{background:var(--blue);border-color:var(--blue);color:#fff;transform:scale(1.1)}
.dot.done{background:var(--lime);border-color:var(--lime2);color:#fff}
.panel{
  min-height:700px;background:#fff;border:3px solid #b8dfea;border-radius:28px;
  padding:24px;box-shadow:var(--shadow)
}
.step-head{display:flex;justify-content:space-between;gap:12px}
.step-head h2{margin:0;font-size:clamp(26px,4vw,38px)}
.help{
  background:#fff7d6;color:#624700;border:3px solid #dfbc44;border-radius:16px;
  padding:10px 17px;font-weight:900
}
.instruction{
  max-width:940px;margin:14px auto 18px;text-align:center;font-size:clamp(20px,2.4vw,25px);
  font-weight:900;line-height:1.35
}
.card{
  max-width:1000px;margin:auto;border:3px solid #c7e4ec;border-radius:28px;
  background:#fff;padding:22px;min-height:470px
}
.feedback{
  display:none;max-width:820px;margin:16px auto 0;padding:12px 18px;border-radius:17px;
  text-align:center;font-weight:900;font-size:20px
}
.feedback.good{display:block;background:#e5f8ef;border:2px solid #87cdae}
.feedback.bad{display:block;background:#fff0ed;border:2px solid #e5a59b}
.check{
  display:block;margin:18px auto 0;padding:13px 28px;border:0;border-radius:16px;
  background:var(--lime);color:#fff;font-size:21px;font-weight:900;box-shadow:0 5px 0 var(--lime2)
}
.check:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lime2)}
.row{display:flex;gap:14px;justify-content:center;align-items:stretch;flex-wrap:wrap}

/* beads */
.bracelet{
  max-width:880px;margin:18px auto;padding:22px 18px;border:3px solid #d1dde7;
  border-radius:24px;background:#fbfdff;display:flex;justify-content:center;align-items:center;
  gap:10px;flex-wrap:wrap;min-height:120px
}
.bead{
  width:58px;height:58px;border-radius:50%;border:4px solid #40566b;
  display:grid;place-items:center;font-size:24px;font-weight:900;color:#17324d;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)
}
.a{background:#f4a62a}.b{background:#39a9e8}.c{background:#a8cb3e}.d{background:#e94785}
.bead span{
  width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #17324d;
  display:grid;place-items:center;font-size:12px
}
.bead.stripe span{border-radius:4px;background:repeating-linear-gradient(45deg,#fff 0 4px,#17324d 4px 7px)}
.bead.tri span{clip-path:polygon(50% 0,100% 100%,0 100%);border:0;background:#17324d}
.bead.cross span{border-radius:4px;background:
 linear-gradient(90deg,transparent 40%,#17324d 40% 60%,transparent 60%),
 linear-gradient(transparent 40%,#17324d 40% 60%,transparent 60%),#fff}

.choice{
  min-width:180px;min-height:145px;border:3px solid var(--line);border-radius:22px;
  background:#fff;padding:14px;font-weight:900;font-size:19px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px
}
.choice:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.choice.selected{background:#eef8d8;border-color:var(--lime)}
.pattern-unit{
  max-width:680px;margin:18px auto;padding:16px;border:4px dashed #c86d72;border-radius:20px;background:#fffafa
}
.pattern-title{text-align:center;font-weight:900;color:#b4424c;margin-bottom:10px;font-size:20px}
.count{
  display:flex;align-items:center;justify-content:center;gap:16px;margin:16px
}
.count button{
  width:52px;height:52px;border-radius:15px;border:3px solid #9bc5d5;background:#fff;
  font-size:28px;font-weight:900
}
.num{font-size:35px;font-weight:900;min-width:40px;text-align:center}

/* stage 4 builder */
.builder{
  max-width:850px;margin:auto;border:3px solid #cbdbe8;border-radius:24px;padding:18px;background:#fbfdff
}
.slotrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.slot{
  width:72px;height:72px;border:3px dashed #8ba7bb;border-radius:50%;background:#fff;
  display:grid;place-items:center;font-weight:900;color:#73889b
}
.palette-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.pal{
  width:70px;height:70px;border:3px solid #6e8294;border-radius:18px;background:#fff;
  display:grid;place-items:center
}
.preview{
  max-width:800px;margin:16px auto 0;padding:14px;border:3px solid #cbd9e6;border-radius:16px;
  text-align:center;background:#f9fcfe;font-weight:900
}

/* stage 5 art */
.artboard{
  max-width:800px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:18px
}
.arttile{
  min-height:250px;border:3px solid #cbd9e6;border-radius:22px;background:#fff;padding:18px
}
.pattern-grid{
  display:grid;grid-template-columns:repeat(6,38px);grid-auto-rows:38px;gap:5px;justify-content:center
}
.pg{
  width:38px;height:38px;border:3px solid #445a6d;border-radius:8px;background:#f4a62a;position:relative
}
.pg:nth-child(3n+2){background:#39a9e8}
.pg:nth-child(3n){background:#a8cb3e}
.pg::after{
  content:"";position:absolute;inset:8px;border:3px solid #17324d;border-radius:50%;background:#fff
}
.art-option{
  margin-top:12px;width:100%;padding:12px;border-radius:14px;border:3px solid #cbd9e6;background:#fff;font-weight:900
}
.art-option.selected{border-color:var(--lime);background:#eef8d8}

/* final */
.finalBox{max-width:760px;margin:auto;text-align:center}
.finalBox .stars{font-size:58px;margin:18px}
.summary{padding:20px;border:4px solid var(--blue);background:var(--soft);border-radius:22px;font-size:21px;font-weight:900;line-height:1.45}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.face{min-height:130px;border:3px solid var(--line);border-radius:20px;background:#fff;font-weight:900;font-size:17px}
.face span{display:block;font-size:52px;margin-bottom:7px}
.face.sel{border-color:var(--lime);background:#eef8d8}

.modal{
  position:fixed;inset:0;background:#17324d99;display:none;place-items:center;padding:18px;z-index:5
}
.modal.show{display:grid}
.modal-box{
  max-width:600px;background:#fff;border-radius:24px;border:4px solid #dfbc44;
  padding:22px;text-align:center;font-size:20px
}
.modal-box button{padding:10px 20px;border:0;border-radius:13px;background:#dfbc44;font-weight:900}
@media(max-width:760px){.artboard{grid-template-columns:1fr}.faces{grid-template-columns:1fr}}
</style>

<style id="nk-license-style">
.nk-license{max-width:1100px;margin:14px auto 24px;padding:10px 16px;text-align:center;font:13px/1.45 Arial,"Noto Sans",sans-serif;color:#4e657c}
.nk-license a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.nk-license .cc-badge{display:inline-block;margin:0 4px;padding:2px 7px;border:1px solid #8aa0b8;border-radius:6px;background:#fff;font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<div class="app">
 <div class="top">
   <div><h1>Ανακάλυψε το μοτίβο</h1></div>
   <div class="badge">2</div>
 </div>
 <div class="path" id="path"></div>
 <main class="panel">
   <div class="step-head">
     <h2 id="stepTitle"></h2>
     <button class="help" onclick="help()">❓ Βοήθεια</button>
   </div>
   <div class="instruction" id="instruction"></div>
   <div class="card" id="card"></div>
   <div class="feedback" id="feedback"></div>
 </main>
</div>

<div class="modal" id="modal">
 <div class="modal-box">
   <h2>💡 Βοήθεια</h2>
   <p id="helpText"></p>
   <button onclick="closeHelp()">Εντάξει</button>
 </div>
</div>

<script>
const steps=[
 {title:"Ποιο έρχεται μετά;",inst:"Παρατήρησε το μοτίβο και διάλεξε τη χάντρα που συνεχίζει σωστά τη σειρά.",help:"Βρες ποιο μικρό κομμάτι επαναλαμβάνεται ξανά και ξανά.",type:"next"},
 {title:"Βρίσκω το μοτίβο",inst:"Ποιο μικρό κομμάτι επαναλαμβάνεται στο βραχιόλι;",help:"Το μοτίβο είναι η μικρότερη ομάδα χαντρών που επαναλαμβάνεται με την ίδια σειρά.",type:"unit"},
 {title:"Πόσες φορές επαναλαμβάνεται;",inst:"Βρες πόσες φορές εμφανίζεται ολόκληρο το μοτίβο στο βραχιόλι.",help:"Μέτρα κάθε ολόκληρη ομάδα του μοτίβου, όχι κάθε χάντρα ξεχωριστά.",type:"count"},
 {title:"Φτιάχνω το δικό μου μοτίβο",inst:"Διάλεξε τρεις διαφορετικές χάντρες και δημιούργησε ένα μοτίβο. Μετά όρισε πόσες φορές θα επαναληφθεί.",help:"Δημιούργησε μια μικρή σειρά και φρόντισε να επαναλαμβάνεται πάντα με την ίδια σειρά.",type:"build"},
 {title:"Μοτίβα στην τέχνη",inst:"Παρατήρησε τα δύο σχέδια και διάλεξε ποιο έχει καθαρό επαναλαμβανόμενο μοτίβο.",help:"Σκέψου αν μπορείς να προβλέψεις ποιο σχήμα θα ακολουθήσει.",type:"art"},
 {title:"Τα κατάφερες!",inst:"Σκέψου τι έμαθες για τα μοτίβα.",help:"Ένα μοτίβο επαναλαμβάνεται και μας επιτρέπει να προβλέπουμε τι ακολουθεί.",type:"final"}
];

let s=0, chosenUnit=null, countN=1, buildSel=[], buildN=3, selfChoice=null;

function path(){
 document.getElementById('path').innerHTML=steps.map((_,i)=>`<div class="dot ${i<s?'done':i===s?'active':''}">${i+1}</div>`).join('');
}
function fb(msg,ok){
 const f=document.getElementById('feedback');
 f.className='feedback '+(ok?'good':'bad');
 f.textContent=msg;
 if(ok)setTimeout(()=>{s++;render()},950);
}
function clearfb(){
 const f=document.getElementById('feedback');
 f.className='feedback';
 f.textContent='';
}
function bead(cls,sym){
 return `<div class="bead ${cls}"><span>${sym||''}</span></div>`;
}
function render(){
 path();clearfb();
 const st=steps[s];
 document.getElementById('stepTitle').textContent=st.title;
 document.getElementById('instruction').textContent=st.inst;

 if(st.type==="next") renderNext();
 if(st.type==="unit") renderUnit();
 if(st.type==="count") renderCount();
 if(st.type==="build") renderBuild();
 if(st.type==="art") renderArt();
 if(st.type==="final") renderFinal();
}

/* stage 1 */
function renderNext(){
 const seq=[
  bead('a','●'),bead('b stripe',''),bead('c tri',''),
  bead('a','●'),bead('b stripe',''),bead('c tri',''),
  bead('a','●'),bead('b stripe','')
 ].join('');
 document.getElementById('card').innerHTML=`
 <div class="bracelet">${seq}<div class="slot">?</div></div>
 <div class="row">
   <button class="choice" onclick="nextAns(false)">${bead('a','●')}Πορτοκαλί · κύκλος</button>
   <button class="choice" onclick="nextAns(false)">${bead('b stripe','')}Γαλάζια · ρίγες</button>
   <button class="choice" onclick="nextAns(true)">${bead('c tri','')}Πράσινη · τρίγωνο</button>
 </div>`;
}
function nextAns(ok){
 fb(ok?"Σωστά! Βρήκες το μοτίβο και προέβλεψες τι ακολουθεί.":"Δοκίμασε ξανά. Παρατήρησε την ομάδα που επαναλαμβάνεται.",ok);
}

/* stage 2 */
function renderUnit(){
 chosenUnit=null;
 const seq=[
   bead('a','●'),bead('b stripe',''),bead('c tri',''),
   bead('a','●'),bead('b stripe',''),bead('c tri',''),
   bead('a','●'),bead('b stripe',''),bead('c tri','')
 ].join('');
 document.getElementById('card').innerHTML=`
 <div class="bracelet">${seq}</div>
 <div class="row">
   <button class="choice" id="u1" onclick="pickUnit(1)">
     <div style="display:flex;gap:5px">${bead('a','●')}${bead('b stripe','')}</div>
     2 χάντρες
   </button>
   <button class="choice" id="u2" onclick="pickUnit(2)">
     <div style="display:flex;gap:5px">${bead('a','●')}${bead('b stripe','')}${bead('c tri','')}</div>
     3 χάντρες
   </button>
   <button class="choice" id="u3" onclick="pickUnit(3)">
     <div style="display:flex;gap:5px">${bead('a','●')}${bead('b stripe','')}${bead('c tri','')}${bead('a','●')}</div>
     4 χάντρες
   </button>
 </div>`;
}
function pickUnit(i){
 chosenUnit=i;
 document.querySelectorAll('[id^="u"]').forEach(x=>x.classList.remove('selected'));
 document.getElementById('u'+i).classList.add('selected');

 if(i===2){
   fb("Μπράβο! Το μοτίβο έχει 3 χάντρες.",true);
 }else{
   fb("Το μοτίβο πρέπει να είναι η μικρότερη ομάδα που επαναλαμβάνεται.",false);
 }
}

/* stage 3 */
function renderCount(){
 countN=1;
 const unit=[bead('a','●'),bead('b stripe',''),bead('c tri',''),bead('d cross','')].join('');
 document.getElementById('card').innerHTML=`
 <div class="pattern-unit">
   <div class="pattern-title">Μοτίβο</div>
   <div style="display:flex;gap:8px;justify-content:center">${unit}</div>
 </div>
 <div class="bracelet">${unit}${unit}${unit}</div>
 <p style="text-align:center;font-weight:900;font-size:20px">Αριθμός επαναλήψεων</p>
 <div class="count">
   <button onclick="changeCount(-1)">−</button>
   <div class="num" id="countNum">${countN}</div>
   <button onclick="changeCount(1)">+</button>
 </div>
 <button class="check" onclick="checkCount()">Έλεγχος</button>`;
}
function changeCount(d){
 countN=Math.max(1,Math.min(6,countN+d));
 document.getElementById('countNum').textContent=countN;
}
function checkCount(){
 fb(countN===3?"Σωστά! Ολόκληρο το μοτίβο επαναλαμβάνεται 3 φορές.":"Μέτρα ξανά πόσες ολόκληρες ομάδες βλέπεις.",countN===3);
}

/* stage 4 */
function renderBuild(){
 buildSel=[];buildN=3;
 document.getElementById('card').innerHTML=`
 <div class="builder">
   <div class="pattern-title">1. Διάλεξε τρεις διαφορετικές χάντρες</div>
   <div class="palette-row">
     <button class="pal" id="p0" onclick="buildPick(0)">${bead('a','●')}</button>
     <button class="pal" id="p1" onclick="buildPick(1)">${bead('b stripe','')}</button>
     <button class="pal" id="p2" onclick="buildPick(2)">${bead('c tri','')}</button>
     <button class="pal" id="p3" onclick="buildPick(3)">${bead('d cross','')}</button>
   </div>
   <div class="pattern-title" style="margin-top:18px">2. Το μοτίβο σου</div>
   <div class="slotrow" id="slots">
     <div class="slot">1</div><div class="slot">2</div><div class="slot">3</div>
   </div>
   <div class="pattern-title">3. Πόσες φορές θα επαναληφθεί;</div>
   <div class="count">
     <button onclick="buildChange(-1)">−</button>
     <div class="num" id="buildNum">${buildN}</div>
     <button onclick="buildChange(1)">+</button>
   </div>
   <div class="preview" id="preview">Διάλεξε τρεις διαφορετικές χάντρες.</div>
   <button class="check" onclick="checkBuild()">Έλεγχος</button>
 </div>`;
}
function buildPick(i){
 if(buildSel.includes(i))return;
 if(buildSel.length>=3)return;
 buildSel.push(i);
 document.getElementById('p'+i).style.opacity='.45';
 updateBuild();
}
function buildChange(d){
 buildN=Math.max(2,Math.min(6,buildN+d));
 document.getElementById('buildNum').textContent=buildN;
 updateBuild();
}
function beadFromIndex(i){
 if(i===0)return bead('a','●');
 if(i===1)return bead('b stripe','');
 if(i===2)return bead('c tri','');
 return bead('d cross','');
}
function updateBuild(){
 const slots=document.getElementById('slots');
 slots.innerHTML=[0,1,2].map(i=>buildSel[i]!==undefined?beadFromIndex(buildSel[i]):`<div class="slot">${i+1}</div>`).join('');
 const p=document.getElementById('preview');
 if(buildSel.length<3){p.textContent='Διάλεξε τρεις διαφορετικές χάντρες.';return;}
 const unit=buildSel.map(beadFromIndex).join('');
 p.innerHTML=`🔁 Το μοτίβο θα επαναληφθεί <b>${buildN}</b> φορές:<div style="display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:10px">${unit.repeat(buildN)}</div>`;
}
function checkBuild(){
 fb(buildSel.length===3?"Μπράβο! Δημιούργησες το δικό σου επαναλαμβανόμενο μοτίβο.":"Διάλεξε τρεις διαφορετικές χάντρες.",buildSel.length===3);
}

/* stage 5 */
function renderArt(){
 document.getElementById('card').innerHTML=`
 <div class="artboard">
   <div class="arttile">
     <div class="pattern-grid">
       ${Array.from({length:24},()=>'<div class="pg"></div>').join('')}
     </div>
     <button class="art-option" onclick="artAns(true,this)">Το σχέδιο έχει επαναλαμβανόμενο μοτίβο.</button>
   </div>
   <div class="arttile">
     <div style="height:190px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap">
       <div style="font-size:60px">⭐</div><div style="font-size:35px">🔷</div><div style="font-size:72px">🌙</div>
       <div style="font-size:42px">⬛</div><div style="font-size:58px">🔺</div>
     </div>
     <button class="art-option" onclick="artAns(false,this)">Το σχέδιο έχει επαναλαμβανόμενο μοτίβο.</button>
   </div>
 </div>`;
}
function artAns(ok,el){
 document.querySelectorAll('.art-option').forEach(x=>x.classList.remove('selected'));
 el.classList.add('selected');
 fb(ok?"Σωστά! Στο πρώτο σχέδιο η ίδια δομή επαναλαμβάνεται.":"Παρατήρησε αν μπορείς να προβλέψεις με σιγουριά τι ακολουθεί.",ok);
}

/* stage 6 */
function renderFinal(){
 selfChoice=null;
 document.getElementById('card').innerHTML=`
 <div class="finalBox">
   <div class="stars">⭐ ⭐ ⭐</div>
   <div class="summary">
     Έμαθες να αναγνωρίζεις ένα μοτίβο, να προβλέπεις τι ακολουθεί,
     να μετράς πόσες φορές επαναλαμβάνεται και να δημιουργείς το δικό σου.
   </div>
   <div class="faces">
     <button class="face" onclick="selfPick(1,this)"><span>🙂</span>Θέλω λίγη εξάσκηση</button>
     <button class="face" onclick="selfPick(2,this)"><span>😊</span>Τα κατάφερα</button>
     <button class="face" onclick="selfPick(3,this)"><span>🤩</span>Τα κατάφερα πολύ καλά</button>
   </div>
   <button class="check" onclick="finish()">Ολοκλήρωση</button>
   <button class="check" style="background:var(--blue);box-shadow:0 5px 0 var(--blue2)" onclick="restartAll()">↻ Επανάληψη δραστηριότητας</button>
 </div>`;
}
function selfPick(v,el){
 selfChoice=v;
 document.querySelectorAll('.face').forEach(x=>x.classList.remove('sel'));
 el.classList.add('sel');
}
function finish(){
 if(!selfChoice){fb("Διάλεξε πρώτα πώς νιώθεις για όσα έμαθες.",false);return;}
 const f=document.getElementById('feedback');
 f.className='feedback good';
 f.textContent='Μπράβο! Ολοκλήρωσες το Μάθημα 2.';
}
function restartAll(){
 s=0;chosenUnit=null;countN=1;buildSel=[];buildN=3;selfChoice=null;render();
