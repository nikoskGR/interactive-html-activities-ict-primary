<style>

*{box-sizing:border-box}body{margin:0;background:#f7fafc;color:var(--ink);font-family:Arial,"Noto Sans",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:16px}.top{background:#fff;border:3px solid #b8dfea;border-radius:24px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}.top h1{margin:0;font-size:clamp(28px,4vw,42px)}.badge{width:68px;height:68px;border-radius:22px;background:var(--blue);display:grid;place-items:center;color:#fff;font-size:31px;font-weight:900}.path{display:flex;gap:10px;justify-content:center;margin:16px 0;flex-wrap:wrap}.dot{width:44px;height:44px;border-radius:50%;border:3px solid #aab9c9;background:#fff;color:#5e7389;display:grid;place-items:center;font-weight:900;font-size:20px}.dot.active{background:var(--blue);border-color:var(--blue);color:#fff;transform:scale(1.1)}.dot.done{background:var(--lime);border-color:var(--lime2);color:#fff}.panel{min-height:720px;background:#fff;border:3px solid #b8dfea;border-radius:28px;padding:24px;box-shadow:var(--shadow)}.step-head{display:flex;justify-content:space-between;gap:12px}.step-head h2{margin:0;font-size:clamp(26px,4vw,38px)}.help{background:#fff7d6;color:#624700;border:3px solid #dfbc44;border-radius:16px;padding:10px 17px;font-weight:900}.instruction{max-width:980px;margin:14px auto 18px;text-align:center;font-size:clamp(20px,2.35vw,25px);font-weight:900;line-height:1.35}.card{max-width:1040px;margin:auto;border:3px solid #c7e4ec;border-radius:28px;background:#fff;padding:22px;min-height:500px}.feedback{display:none;max-width:860px;margin:16px auto 0;padding:12px 18px;border-radius:17px;text-align:center;font-weight:900;font-size:20px}.feedback.good{display:block;background:#e5f8ef;border:2px solid #87cdae}.feedback.bad{display:block;background:#fff0ed;border:2px solid #e5a59b}.check{display:block;margin:18px auto 0;padding:13px 28px;border:0;border-radius:16px;background:var(--lime);color:#fff;font-size:21px;font-weight:900;box-shadow:0 5px 0 var(--lime2)}
/* Noesis Icons */
.noesis{max-width:980px;margin:auto;border:4px solid var(--purple);border-radius:22px;background:#fff;overflow:hidden;box-shadow:0 10px 22px rgba(23,50,77,.16)}.ntitle{height:52px;background:linear-gradient(90deg,#6b56c7,#8d63d4);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 15px;font-size:21px;font-weight:900}.nbrand{display:flex;align-items:center;gap:10px}.nlogo{width:32px;height:32px;border-radius:10px;background:#fff;color:#6c54bf;display:grid;place-items:center;font-size:19px;font-weight:900}.nmenu{height:38px;background:#faf8ff;border-bottom:2px solid #e3d9ee;display:flex;align-items:center;gap:18px;padding:0 13px;font-size:14px}.nbody{display:grid;grid-template-columns:1.05fr .95fr;min-height:440px}.stagePane{padding:14px;background:#fff;border-right:2px solid #ddd2ec;position:relative}.room{position:relative;width:100%;aspect-ratio:4/3;border:3px solid #7b8e9c;border-radius:16px;overflow:hidden;background:linear-gradient(to bottom,#f3ece0 0 68%,#c99762 68% 100%)}.room::before{content:"";position:absolute;left:0;right:0;top:68%;height:3px;background:#8f6848}.window{position:absolute;left:50%;top:32px;transform:translateX(-50%);width:155px;height:95px;border:9px solid #cbb49b;background:linear-gradient(#bfe9ff 0 58%,#6fae5e 58%);box-shadow:inset 0 0 0 3px #7f6d5c}.window::before,.window::after{content:"";position:absolute;background:#cbb49b}.window::before{left:50%;top:0;bottom:0;width:7px;transform:translateX(-50%)}.window::after{left:0;right:0;top:50%;height:7px;transform:translateY(-50%)}.rug{position:absolute;left:12%;right:12%;bottom:16px;height:74px;border-radius:50%;background:radial-gradient(ellipse,#d8b79b 0 64%,#b48b6e 65%)}.storyTitle{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:8;background:#fff8d7;border:3px solid #e0bc49;border-radius:14px;padding:7px 16px;font-weight:900;display:none;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.animal{position:absolute;z-index:5;width:84px;height:84px;display:grid;place-items:end center;font-size:72px;line-height:1;transform-origin:center bottom;transition:transform .38s ease,left .38s ease,top .38s ease;filter:drop-shadow(0 3px 2px rgba(0,0,0,.18))}.animal.a1{left:14%;top:58%}.animal.a2{left:41%;top:56%}.animal.a3{left:68%;top:58%}.animal.selected{filter:drop-shadow(0 0 8px #ffd54a) drop-shadow(0 3px 2px rgba(0,0,0,.18))}.stageTools{position:absolute;right:12px;top:12px;z-index:10;display:flex;gap:8px}.roundTool{width:50px;height:46px;border:3px solid #8fa7ba;border-radius:14px;background:#fff;display:grid;place-items:center;font-weight:900;color:#38556d}.abcTool{background:#dff5ff;color:#0b6b94}.flagBtn{background:#fff8c9;border-color:#d2aa18;font-size:25px}.stopTool{background:transparent;border:0;width:50px;height:46px;display:none;place-items:center}.stopTool.show{display:grid}.hex{width:43px;height:39px;background:var(--red);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}.programPane{background:#f7f5fb;padding:14px;display:flex;flex-direction:column}.areaTitle{font-weight:900;text-align:center;margin-bottom:8px}.palette{min-height:90px;border:3px solid #d5cbea;border-radius:16px;background:#fff;padding:9px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.workspace{flex:1;margin-top:12px;border:3px dashed #a996cb;border-radius:16px;background:#fff;padding:13px;min-height:175px}.workspace .hint{text-align:center;color:#7b6b92;font-weight:900;padding:20px 8px}.runbar{margin-top:10px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.run{border:0;border-radius:14px;padding:10px 18px;background:#29a85f;color:white;font-weight:900}.resetMini{border:2px solid #9aacc0;border-radius:14px;padding:10px 18px;background:#fff;color:var(--ink);font-weight:900}
/* blocks */
.iblock{min-width:66px;height:62px;border-radius:14px;background:#2aa5d4;border:4px solid #0d7ca8;color:#fff;display:grid;grid-template-rows:1fr 21px;place-items:center;font-size:29px;font-weight:900;box-shadow:0 4px 0 #075f83;padding-top:2px}.iblock .val{min-width:28px;padding:0 7px;height:21px;border-radius:11px;background:#fff;color:#0b6f96;border:2px solid #2aa5d4;font-size:13px;line-height:17px;display:grid;place-items:center}.homeBlock{background:#3479ce;border-color:#245ca0}.turnBlock{background:#2aa5d4;border-color:#0d7ca8}.flagBlock{background:#f0c52f;border-color:#c49c11;color:#213a52}.flagBlock .val{color:#806400;border-color:#f0c52f}.foreverBlock{background:#db3b4b;border-color:#a91f31}.foreverBlock .val{color:#9d2635;border-color:#db3b4b}.blockBtn{border:0;background:transparent;padding:0}.programLine{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}.slot{width:72px;height:66px;border:3px dashed #9c8cbc;border-radius:14px;background:#fbfaff;display:grid;place-items:center;color:#7a6b95;font-weight:900}.slot.selectedSlot{outline:4px solid #f2c535}.slot.filled{border:0;background:transparent}.charTabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 10px}.charTab{min-width:84px;border:3px solid #c6b8df;border-radius:14px;background:#fff;padding:7px 10px;font-size:25px;font-weight:900}.charTab.active{background:#efe9ff;border-color:#7358c7}.charTab.done{box-shadow:inset 0 0 0 3px #8fbd24}.patternCard{min-width:112px;border:3px solid #b8cddd;border-radius:16px;background:#fff;padding:8px;font-weight:900}.patternCard.used{opacity:.45}.miniProg{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap}.mini{width:34px;height:32px;border-radius:7px;background:#2aa5d4;color:#fff;border:2px solid #0d7ca8;display:grid;place-items:center}.multiProg{display:grid;gap:8px}.progRow{border:2px solid #d7cdea;border-radius:14px;padding:8px;background:#fcfbff}.progHead{display:flex;align-items:center;gap:7px;font-weight:900;margin-bottom:6px}.progBlocks{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.smallB{width:43px;height:40px;border-radius:9px;background:#2aa5d4;border:3px solid #0d7ca8;color:#fff;display:grid;place-items:center;font-size:20px;font-weight:900}.smallFlag{background:#f0c52f;border-color:#c49c11}.smallForever{background:#db3b4b;border-color:#a91f31}.titleDialog{display:none;margin-top:10px;border:3px solid #9bc9db;border-radius:16px;padding:12px;background:#f3fbff}.titleDialog.show{display:block}.titleDialog input{width:100%;padding:10px 12px;border:3px solid #9ab9cc;border-radius:12px;font-size:20px;font-weight:800}.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.face{min-height:130px;border:3px solid var(--line);border-radius:20px;background:#fff;font-weight:900;font-size:17px}.face span{display:block;font-size:52px;margin-bottom:7px}.face.sel{border-color:var(--lime);background:#eef8d8}.finalBox{max-width:780px;margin:auto;text-align:center}.stars{font-size:58px;margin:18px}.summary{padding:20px;border:4px solid var(--blue);background:var(--soft);border-radius:22px;font-size:21px;font-weight:900;line-height:1.45}.modal{position:fixed;inset:0;background:#17324d99;display:none;place-items:center;padding:18px;z-index:20}.modal.show{display:grid}.modal-box{max-width:620px;background:#fff;border-radius:24px;border:4px solid #dfbc44;padding:22px;text-align:center;font-size:20px}.modal-box button{padding:10px 20px;border:0;border-radius:13px;background:#dfbc44;font-weight:900}@media(max-width:840px){.nbody{grid-template-columns:1fr}.stagePane{border-right:0;border-bottom:2px solid #ddd2ec}.faces{grid-template-columns:1fr}}
</style>

<body>
<div class="app"><div class="top"><h1>Πάρτι χορού</h1><div class="badge">7</div></div><div class="path" id="path"></div><main class="panel"><div class="step-head"><h2 id="title"></h2><button class="help" onclick="help()">❓ Βοήθεια</button></div><div class="instruction" id="inst"></div><div class="card" id="card"></div><div class="feedback" id="feedback"></div></main></div>
<div class="modal" id="modal"><div class="modal-box"><h2>💡 Βοήθεια</h2><p id="helpText"></p><button onclick="closeHelp()">Εντάξει</button></div></div>
<script>
const steps=[
 {t:"Φτιάχνω ένα μοτίβο χορού",i:"Διάλεξε τέσσερις μπλε εντολές κίνησης για το λαγουδάκι και εκτέλεσε το δικό σου μοτίβο.",h:"Ένα μοτίβο χορού είναι μια μικρή σειρά κινήσεων. Μπορείς να διαλέξεις δεξιά, αριστερά, πάνω ή κάτω.",k:"pattern"},
 {t:"Επιστρέφω στην αρχική θέση",i:"Βάλε την εντολή ΑΡΧΗ στη σωστή θέση ώστε το λαγουδάκι, αφού χορέψει, να επιστρέψει στο σημείο από όπου ξεκίνησε.",h:"Αν θέλεις να επιστρέψει στο τέλος, η εντολή ΑΡΧΗ πρέπει να εκτελεστεί μετά τις κινήσεις.",k:"home"},
 {t:"Στρίβω δεξιά και αριστερά",i:"Συμπλήρωσε το μοτίβο με ΣΤΡΙΨΕ ΔΕΞΙΑ και μετά ΣΤΡΙΨΕ ΑΡΙΣΤΕΡΑ και παρατήρησε την περιστροφή.",h:"Οι δύο νέες εντολές περιστρέφουν τον χαρακτήρα προς τη μία ή την άλλη κατεύθυνση.",k:"turn"},
 {t:"Κάθε χαρακτήρας έχει δικό του πρόγραμμα",i:"Διάλεξε έναν διαφορετικό χορό για κάθε χαρακτήρα. Χρησιμοποίησε τη λίστα χαρακτήρων για να αλλάζεις ποιον προγραμματίζεις.",h:"Κάθε χαρακτήρας έχει το δικό του πρόγραμμα. Πρώτα διάλεξε τον χαρακτήρα και μετά τον χορό του.",k:"separate"},
 {t:"Ξεκινάμε όλοι με την πράσινη σημαία",i:"Βάλε την πράσινη σημαία ως πρώτη εντολή και στα τρία προγράμματα. Μετά πάτησε την πράσινη σημαία για να ξεκινήσουν όλοι μαζί.",h:"Η πράσινη σημαία είναι ένα γεγονός. Όταν την πατήσεις, ξεκινούν όλα τα προγράμματα που αρχίζουν με αυτή.",k:"flag"},
 {t:"Χορεύουμε για πάντα",i:"Πρόσθεσε την κόκκινη εντολή ΕΠΑΝΑΛΑΒΕ ΓΙΑ ΠΑΝΤΑ και στους τρεις χαρακτήρες. Ξεκίνα με την πράσινη σημαία και σταμάτα το πάρτι με το κόκκινο εξάγωνο.",h:"Η κόκκινη εντολή κάνει το πρόγραμμα να επαναλαμβάνεται ασταμάτητα μέχρι να πατήσεις STOP.",k:"forever"},
 {t:"Δίνω τίτλο στην ιστορία",i:"Πάτησε το κουμπί ABC και γράψε έναν τίτλο για την ιστορία σου.",h:"Το κουμπί ABC ανοίγει το πλαίσιο τίτλου. Γράψε έναν μικρό τίτλο και αποθήκευσέ τον.",k:"title"},
 {t:"Τα κατάφερες!",i:"Σκέψου τι έμαθες στο Noesis Icons.",h:"Σκέψου τις νέες εντολές: στροφή, πράσινη σημαία, επανάληψη για πάντα και τίτλος ιστορίας.",k:"final"}
];
let s=0,selfChoice=null,buildPattern=[],homeSlot=null,turnSlots=[null,null],selectedChar=0,charPatterns=[null,null,null],flagAdded=[false,false,false],foreverAdded=[false,false,false],danceTimers=[],storyTitle="";
const animals=['🐇','🐈','🐕'];
const presetPatterns=[['right','left','right','left'],['up','down','up','down'],['turnR','turnL','turnR','turnL']];
function nav(){document.getElementById('path').innerHTML=steps.map((_,i)=>`<div class="dot ${i<s?'done':i===s?'active':''}">${i+1}</div>`).join('')}
function clearFeedback(){const f=document.getElementById('feedback');f.className='feedback';f.textContent=''}
function setFeedback(t,ok){const f=document.getElementById('feedback');f.className='feedback '+(ok?'good':'bad');f.textContent=t}
function B(icon,val,cls=''){return `<div class="iblock ${cls}"><div>${icon}</div><div class="val">${val}</div></div>`}
function iconFor(c){return c==='right'?'➡':c==='left'?'⬅':c==='up'?'⬆':c==='down'?'⬇':c==='turnR'?'↻':c==='turnL'?'↺':'↩'}
function labelFor(c){return c==='right'?'1':c==='left'?'1':c==='up'?'1':c==='down'?'1':c==='turnR'?'1':c==='turnL'?'1':'Αρχή'}
function blockFor(c){return B(iconFor(c),labelFor(c),c==='home'?'homeBlock':(c==='turnR'||c==='turnL')?'turnBlock':'')}
function roomHTML(selected=0,tools=''){return `<div class="room"><div class="window"></div><div class="rug"></div><div class="storyTitle" id="storyTitle">${storyTitle}</div><div id="animal0" class="animal a1 ${selected===0?'selected':''}">${animals[0]}</div><div id="animal1" class="animal a2 ${selected===1?'selected':''}">${animals[1]}</div><div id="animal2" class="animal a3 ${selected===2?'selected':''}">${animals[2]}</div><div class="stageTools">${tools}</div></div>`}
function noesis(scene,program,palette,extra=''){return `<div class="noesis"><div class="ntitle"><div class="nbrand"><span class="nlogo">Ν</span><span>Noesis Icons</span></div><span>— □ ×</span></div><div class="nmenu"><span>Αρχείο</span><span>Έργο</span><span>Χαρακτήρες</span><span>Σκηνικό</span><span>Βοήθεια</span></div><div class="nbody"><div class="stagePane">${scene}</div><div class="programPane"><div class="areaTitle">Εντολές</div><div class="palette">${palette}</div><div class="areaTitle" style="margin-top:12px">Χώρος προγράμματος</div><div class="workspace">${program}</div>${extra}</div></div></div>`}
function render(){stopAll();nav();clearFeedback();const x=steps[s];document.getElementById('title').textContent=x.t;document.getElementById('inst').textContent=x.i;if(x.k==='pattern')stage1();if(x.k==='home')stage2();if(x.k==='turn')stage3();if(x.k==='separate')stage4();if(x.k==='flag')stage5();if(x.k==='forever')stage6();if(x.k==='title')stage7();if(x.k==='final')stage8()}
function state(el){return {x:0,y:0,r:0};}
function resetAnimal(id){const el=document.getElementById(id);if(el){el.dataset.x='0';el.dataset.y='0';el.dataset.r='0';el.style.transform='translate(0,0) rotate(0deg)'}}
function resetAllAnimals(){for(let i=0;i<3;i++)resetAnimal('animal'+i)}
function applyCmd(el,c){let x=+(el.dataset.x||0),y=+(el.dataset.y||0),r=+(el.dataset.r||0);if(c==='right')x+=36;if(c==='left')x-=36;if(c==='up')y-=28;if(c==='down')y+=28;if(c==='turnR')r+=45;if(c==='turnL')r-=45;if(c==='home'){x=0;y=0;r=0}el.dataset.x=x;el.dataset.y=y;el.dataset.r=r;el.style.transform=`translate(${x}px,${y}px) rotate(${r}deg)`}
function animateCommands(id,cmds,done,speed=480){const el=document.getElementById(id);if(!el){if(done)done();return}resetAnimal(id);let i=0;const timer=setInterval(()=>{if(i>=cmds.length){clearInterval(timer);setTimeout(()=>done&&done(),350);return}applyCmd(el,cmds[i]);i++},speed);danceTimers.push(timer)}
function stopAll(){danceTimers.forEach(clearInterval);danceTimers=[]}
/* Stage 1 */
function stage1(){buildPattern=[];const palette=['right','left','up','down'].map(c=>`<button class="blockBtn" onclick="addPattern('${c}')">${blockFor(c)}</button>`).join('');const slots=Array.from({length:4},(_,i)=>`<div class="slot" id="pSlot${i}">${i+1}</div>`).join('');const program=`<div class="programLine">${slots}</div><div class="hint">Πάτησε ένα μπλοκ που έβαλες για να το αφαιρέσεις.</div>`;const extra=`<div class="runbar"><button class="run" onclick="runPattern()">▶ Εκτέλεση</button></div>`;document.getElementById('card').innerHTML=noesis(roomHTML(0),program,palette,extra)}
function addPattern(c){if(buildPattern.length>=4)return;buildPattern.push(c);drawPattern()}
function drawPattern(){for(let i=0;i<4;i++){const sl=document.getElementById('pSlot'+i);if(i<buildPattern.length){sl.className='slot filled';sl.innerHTML=`<button class="blockBtn" onclick="removePattern(${i})">${blockFor(buildPattern[i])}</button>`}else{sl.className='slot';sl.textContent=i+1}}}
function removePattern(i){buildPattern.splice(i,1);drawPattern()}
function runPattern(){if(buildPattern.length!==4){setFeedback('Χρειάζονται τέσσερις κινήσεις για το μοτίβο σου.',false);return}setFeedback('Ωραία! Παρατήρησε το λαγουδάκι να εκτελεί το μοτίβο που δημιούργησες.',true);animateCommands('animal0',buildPattern,()=>{s++;render()},480)}
/* Stage 2 */
function stage2(){homeSlot=null;const palette=`<button class="blockBtn" onclick="placeHome()">${blockFor('home')}</button>`;const program=`<div class="programLine"><div class="slot" id="beforeSlot" onclick="chooseHomeSlot('before')">πριν</div>${blockFor('right')}${blockFor('right')}${blockFor('up')}<div class="slot" id="afterSlot" onclick="chooseHomeSlot('after')">μετά</div></div>`;const extra=`<div class="runbar"><button class="run" onclick="runHome()">▶ Εκτέλεση</button></div>`;document.getElementById('card').innerHTML=noesis(roomHTML(0),program,palette,extra)}
function chooseHomeSlot(which){homeSlot=which;document.getElementById('beforeSlot').classList.toggle('selectedSlot',which==='before');document.getElementById('afterSlot').classList.toggle('selectedSlot',which==='after')}
function placeHome(){if(!homeSlot){setFeedback('Διάλεξε πρώτα το πλαίσιο πριν ή μετά τις κινήσεις.',false);return}const sl=document.getElementById(homeSlot==='before'?'beforeSlot':'afterSlot');sl.className='slot filled';sl.innerHTML=`<button class="blockBtn" onclick="removeHome(event)">${blockFor('home')}</button>`}
function removeHome(e){e.stopPropagation();const sl=e.currentTarget.closest('.slot');sl.className='slot';sl.textContent=sl.id==='beforeSlot'?'πριν':'μετά';homeSlot=null}
function runHome(){const after=document.getElementById('afterSlot').classList.contains('filled');if(!after){setFeedback('Για να επιστρέψει αφού χορέψει, βάλε την ΑΡΧΗ μετά τις κινήσεις.',false);return}setFeedback('Σωστά! Πρώτα εκτελεί τις κινήσεις και στο τέλος επιστρέφει στην αρχική θέση.',true);animateCommands('animal0',['right','right','up','home'],()=>{s++;render()},480)}
/* Stage 3 */
function stage3(){turnSlots=[null,null];const palette=`<button class="blockBtn" onclick="addTurn('turnR')">${blockFor('turnR')}</button><button class="blockBtn" onclick="addTurn('turnL')">${blockFor('turnL')}</button>`;const program=`<div class="programLine">${blockFor('up')}<div class="slot" id="t0">1</div><div class="slot" id="t1">2</div>${blockFor('down')}${blockFor('home')}</div>`;const extra=`<div class="runbar"><button class="run" onclick="runTurn()">▶ Εκτέλεση</button></div>`;document.getElementById('card').innerHTML=noesis(roomHTML(0),program,palette,extra)}
function addTurn(c){const idx=turnSlots.indexOf(null);if(idx<0)return;turnSlots[idx]=c;const sl=document.getElementById('t'+idx);sl.className='slot filled';sl.innerHTML=`<button class="blockBtn" onclick="removeTurn(event,${idx})">${blockFor(c)}</button>`}
function removeTurn(e,i){e.stopPropagation();turnSlots[i]=null;const sl=document.getElementById('t'+i);sl.className='slot';sl.textContent=i+1}
function runTurn(){if(turnSlots[0]!=='turnR'||turnSlots[1]!=='turnL'){setFeedback('Η σειρά ζητά πρώτα ΣΤΡΙΨΕ ΔΕΞΙΑ και μετά ΣΤΡΙΨΕ ΑΡΙΣΤΕΡΑ.',false);return}setFeedback('Σωστά! Παρατήρησε τις δύο περιστροφές.',true);animateCommands('animal0',['up','turnR','turnL','down','home'],()=>{s++;render()},520)}
/* Stage 4 */
function tabsHTML(){
 return `<div class="charTabs">${animals.map((a,i)=>{
   const done = s===3 ? charPatterns[i]!==null : s===4 ? flagAdded[i] : s===5 ? foreverAdded[i] : false;
   return `<button class="charTab ${selectedChar===i?'active':''} ${done?'done':''}" onclick="selectChar(${i})">${a}</button>`;
 }).join('')}</div>`;
}
function stage4(){selectedChar=0;charPatterns=[null,null,null];drawSeparate()}
function drawSeparate(){const cards=presetPatterns.map((p,i)=>`<button class="patternCard ${charPatterns.includes(i)?'used':''}" onclick="assignPattern(${i})"><div class="miniProg">${p.map(c=>`<span class="mini">${iconFor(c)}</span>`).join('')}</div><div>Χορός ${i+1}</div></button>`).join('');const program=`${tabsHTML()}<div class="hint">Επίλεξε χαρακτήρα και μετά έναν διαφορετικό χορό.</div><div class="programLine">${charPatterns[selectedChar]===null?'':presetPatterns[charPatterns[selectedChar]].map(blockFor).join('')}</div>`;document.getElementById('card').innerHTML=noesis(roomHTML(selectedChar),program,cards,'')}
function selectChar(i){
 selectedChar=i;
 if(s===3){drawSeparate();return;}
 if(s===4){drawFlagStage();return;}
 if(s===5){drawForever();return;}
}
function assignPattern(p){if(charPatterns.includes(p)&&charPatterns[selectedChar]!==p){setFeedback('Αυτός ο χορός χρησιμοποιείται ήδη. Διάλεξε διαφορετικό.',false);return}charPatterns[selectedChar]=p;if(charPatterns.every(v=>v!==null)){setFeedback('Μπράβο! Κάθε χαρακτήρας έχει τώρα το δικό του πρόγραμμα.',true);setTimeout(()=>{s++;render()},900)}else drawSeparate()}
/* Stage 5 */
function stage5(){selectedChar=0;flagAdded=[false,false,false];drawFlagStage()}
function smallProgram(i,withForever=false){const p=presetPatterns[charPatterns[i]??i];return `<div class="progBlocks">${flagAdded[i]?'<span class="smallB smallFlag">⚑</span>':'<span class="slot" style="width:44px;height:42px">1η</span>'}${p.map(c=>`<span class="smallB">${iconFor(c)}</span>`).join('')}${withForever&&foreverAdded[i]?'<span class="smallB smallForever">∞</span>':''}</div>`}
function drawFlagStage(){const palette=`<button class="blockBtn" onclick="addFlag()">${B('⚑','σημαία','flagBlock')}</button>`;const program=`${tabsHTML()}<div class="multiProg">${animals.map((a,i)=>`<div class="progRow"><div class="progHead">${a} ${i===selectedChar?'← επιλεγμένος':''}</div>${smallProgram(i)}</div>`).join('')}</div>`;const tools=`<button class="roundTool flagBtn" onclick="pressFlag()">⚑</button>`;document.getElementById('card').innerHTML=noesis(roomHTML(selectedChar,tools),program,palette,'')}
function addFlag(){flagAdded[selectedChar]=true;if(flagAdded.every(Boolean)){setFeedback('Τώρα και τα τρία προγράμματα ξεκινούν με την πράσινη σημαία. Πάτησέ τη στη σκηνή.',true)}drawFlagStage()}
function pressFlag(){if(!flagAdded.every(Boolean)){setFeedback('Βάλε πρώτα την πράσινη σημαία ως πρώτη εντολή και στα τρία προγράμματα.',false);return}setFeedback('Η πράσινη σημαία είναι γεγονός: όλοι ξεκινούν ταυτόχρονα!',true);runAllOnce(()=>{s++;render()})}
function runAllOnce(done){let finished=0;for(let i=0;i<3;i++){animateCommands('animal'+i,presetPatterns[charPatterns[i]],()=>{finished++;if(finished===3)done&&done()},420)}}
/* Stage 6 */
function stage6(){selectedChar=0;foreverAdded=[false,false,false];drawForever()}
function drawForever(){const palette=`<button class="blockBtn" onclick="addForever()">${B('∞','για πάντα','foreverBlock')}</button>`;const program=`${tabsHTML()}<div class="multiProg">${animals.map((a,i)=>`<div class="progRow"><div class="progHead">${a} ${i===selectedChar?'← επιλεγμένος':''}</div><div class="progBlocks"><span class="smallB smallFlag">⚑</span>${presetPatterns[charPatterns[i]].map(c=>`<span class="smallB">${iconFor(c)}</span>`).join('')}${foreverAdded[i]?'<span class="smallB smallForever">∞</span>':'<span class="slot" style="width:44px;height:42px">∞</span>'}</div></div>`).join('')}</div>`;const tools=`<button class="roundTool flagBtn" onclick="startForever()">⚑</button><button class="stopTool" id="stopTool" onclick="stopForever()"><span class="hex"></span></button>`;document.getElementById('card').innerHTML=noesis(roomHTML(selectedChar,tools),program,palette,'')}
function addForever(){foreverAdded[selectedChar]=true;if(foreverAdded.every(Boolean))setFeedback('Όλα τα προγράμματα είναι έτοιμα να επαναλαμβάνονται για πάντα. Πάτησε την πράσινη σημαία.',true);drawForever()}
function startForever(){if(!foreverAdded.every(Boolean)){setFeedback('Πρόσθεσε πρώτα ΕΠΑΝΑΛΑΒΕ ΓΙΑ ΠΑΝΤΑ και στους τρεις χαρακτήρες.',false);return}document.getElementById('stopTool').classList.add('show');setFeedback('Το πάρτι συνεχίζεται! Πάτησε το κόκκινο εξάγωνο για να σταματήσει.',true);startForeverLoops()}
function startForeverLoops(){stopAll();for(let i=0;i<3;i++){const el=document.getElementById('animal'+i);resetAnimal('animal'+i);let pos=0;const p=presetPatterns[charPatterns[i]];const timer=setInterval(()=>{applyCmd(el,p[pos%p.length]);pos++},360);danceTimers.push(timer)}}
function stopForever(){stopAll();const b=document.getElementById('stopTool');if(b)b.classList.remove('show');setFeedback('Μπράβο! Σταμάτησες το πάρτι με το κόκκινο εξάγωνο.',true);setTimeout(()=>{s++;render()},900)}
/* Stage 7 */
function stage7(){storyTitle='';const tools=`<button class="roundTool abcTool" onclick="openTitle()">ABC</button>`;const program=`<div class="hint">Πάτησε ABC στη σκηνή για να γράψεις τον τίτλο της ιστορίας σου.</div><div class="titleDialog" id="titleDialog"><input id="titleInput" maxlength="30" placeholder="Γράψε έναν τίτλο"><button class="check" style="margin-top:12px" onclick="saveTitle()">Αποθήκευση τίτλου</button></div>`;document.getElementById('card').innerHTML=noesis(roomHTML(0,tools),program,'<span style="font-weight:900;color:#5f6f7e">Τίτλος ιστορίας</span>','')}
function openTitle(){document.getElementById('titleDialog').classList.add('show');setTimeout(()=>document.getElementById('titleInput').focus(),50)}
function saveTitle(){const v=document.getElementById('titleInput').value.trim();if(v.length<2){setFeedback('Γράψε έναν μικρό τίτλο για την ιστορία σου.',false);return}storyTitle=v;const t=document.getElementById('storyTitle');t.textContent=v;t.style.display='block';setFeedback('Ωραία! Έδωσες τίτλο στην ιστορία σου.',true);setTimeout(()=>{s++;render()},1000)}
/* Stage 8 */
function stage8(){selfChoice=null;document.getElementById('card').innerHTML=`<div class="finalBox"><div class="stars">⭐ ⭐ ⭐</div><div class="summary">Έμαθες να χρησιμοποιείς τις εντολές ΣΤΡΙΨΕ ΔΕΞΙΑ και ΣΤΡΙΨΕ ΑΡΙΣΤΕΡΑ, να ξεκινάς πολλά προγράμματα μαζί με την πράσινη σημαία, να χρησιμοποιείς ΕΠΑΝΑΛΑΒΕ ΓΙΑ ΠΑΝΤΑ και να δίνεις τίτλο στην ιστορία σου.</div><div class="faces"><button class="face" onclick="selfPick(1,this)"><span>🙂</span>Θέλω λίγη εξάσκηση</button><button class="face" onclick="selfPick(2,this)"><span>😊</span>Τα κατάφερα</button><button class="face" onclick="selfPick(3,this)"><span>🤩</span>Τα κατάφερα πολύ καλά</button></div><button class="check" onclick="finish()">Ολοκλήρωση</button><button class="check" style="background:var(--blue);box-shadow:0 5px 0 var(--blue2)" onclick="restartAll()">↻ Επανάληψη δραστηριότητας</button></div>`}
function selfPick(v,e){selfChoice=v;document.querySelectorAll('.face').forEach(x=>x.classList.remove('sel'));e.classList.add('sel')}
function finish(){const f=document.getElementById('feedback');if(!selfChoice){f.className='feedback bad';f.textContent='Διάλεξε πρώτα πώς νιώθεις για όσα έμαθες.';return}f.className='feedback good';f.textContent='Μπράβο! Ολοκλήρωσες το Μάθημα 7.'}
function restartAll(){stopAll();s=0;selfChoice=null;buildPattern=[];homeSlot=null;turnSlots=[null,null];selectedChar=0;charPatterns=[null,null,null];flagAdded=[false,false,false];foreverAdded=[false,false,false];storyTitle='';render()}
function help(){document.getElementById('helpText').textContent=steps[s].h;document.getElementById('modal').classList.add('show')}
function closeHelp(){document.getElementById('modal').classList.remove('show')}
render();
</script>
