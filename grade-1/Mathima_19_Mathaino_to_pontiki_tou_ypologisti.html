<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="Nikos Kalakos">
<meta name="copyright" content="© 2026 Nikos Kalakos">
<meta name="license" content="Original educational content and simulation design: CC BY-NC 4.0; source code © 2026 Nikos Kalakos; third-party and textbook materials excluded.">
<title>Μάθημα 19 - Το ποντίκι</title>
<style>
:root{
  --ink:#17324d;
  --unit:#D93A2E;
  --unit-dark:#A92B22;
  --unit-soft:#FDECEA;
  --blue:#3268d5;
  --line:#c9d8e7;
  --ok:#2f9b63;
  --bad:#d85c4b;
  --yellow:#f3c84a;
  --shadow:0 10px 28px rgba(23,50,77,.12)
}
*{box-sizing:border-box}
body{margin:0;background:#f7fafc;color:var(--ink);font-family:Arial,"Noto Sans",sans-serif}
button{font:inherit;cursor:pointer}
.app{max-width:1160px;margin:auto;padding:16px}
.top{
  background:#fff;border:3px solid #f0c4bf;border-radius:24px;padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)
}
.top h1{margin:0;font-size:clamp(28px,4vw,42px)}
.top small{font-size:18px}
.unit-badge{
  width:66px;height:66px;border-radius:22px;background:var(--unit);
  display:grid;place-items:center;color:#fff;font-size:31px;font-weight:900
}
.path{display:flex;gap:10px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.dot{
  width:44px;height:44px;border-radius:50%;border:3px solid #aab9c9;
  background:#fff;color:#5e7389;display:grid;place-items:center;font-weight:900;font-size:20px
}
.dot.active{background:var(--blue);border-color:var(--blue);color:#fff;transform:scale(1.1)}
.dot.done{background:var(--unit);border-color:var(--unit-dark);color:#fff}
.panel{
  min-height:700px;background:#fff;border:3px solid #f0c4bf;border-radius:28px;
  padding:24px;box-shadow:var(--shadow)
}
.step-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.step-head h2{margin:0;font-size:clamp(26px,4vw,38px)}
.help{
  background:#fff7d6;color:#624700;border:3px solid #dfbc44;border-radius:16px;
  padding:10px 17px;font-weight:900
}
.instruction{
  max-width:900px;margin:14px auto 18px;text-align:center;
  font-size:clamp(20px,2.4vw,25px);font-weight:900
}
.feedback{
  display:none;max-width:800px;margin:16px auto 0;padding:12px 18px;border-radius:17px;
  text-align:center;font-weight:900;font-size:20px
}
.feedback.good{display:block;background:#e5f8ef;color:#07583c;border:2px solid #79d4ae}
.feedback.bad{display:block;background:#fff0e8;color:#713629;border:2px solid #e5a48d}

/* shared cards */
.lesson-card{
  max-width:980px;margin:0 auto;border:3px solid #f1c0ba;border-radius:28px;background:#fff;
  padding:24px;min-height:470px;position:relative;overflow:hidden
}
.decor{position:absolute;font-size:45px;opacity:.9}
.decor.d1{left:20px;top:20px}.decor.d2{right:25px;top:30px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:end;min-height:390px}
.choice{
  min-height:210px;border:4px solid var(--line);border-radius:25px;background:#fff;
  display:grid;place-items:center;box-shadow:0 7px 0 #e4ebf0;transition:.15s
}
.choice:hover{transform:translateY(-4px)}
.choice .icon{font-size:110px}
.choice.ok{border-color:var(--ok);background:#ebfff5}
.choice.no{border-color:var(--bad);background:#fff0ee}

/* realistic-ish CSS mouse */
.mouse{
  width:220px;height:285px;border:6px solid #2b3947;border-radius:100px 100px 115px 115px;
  background:linear-gradient(#f7f7fb,#e7edf3);position:relative;
  box-shadow:0 12px 20px rgba(0,0,0,.15)
}
.mouse:before{
  content:'';position:absolute;left:50%;top:-70px;width:7px;height:72px;background:#2b3947;
  transform:translateX(-50%)
}
.mouse.wireless:before{display:none}
.ml,.mr{
  position:absolute;top:0;width:50%;height:118px;background:#f0f3f7;border-bottom:5px solid #2b3947
}
.ml{left:0;border-radius:95px 0 0 0;border-right:2px solid #2b3947}
.mr{right:0;border-radius:0 95px 0 0;border-left:2px solid #2b3947}
.wheel{
  position:absolute;z-index:5;left:50%;top:45px;transform:translateX(-50%);
  width:28px;height:64px;border:5px solid #2b3947;border-radius:18px;background:var(--yellow)
}
.hit{outline:6px solid var(--unit);background:var(--unit-soft)!important}


.mouse .ml.hit-left{background:#7fc97f!important;outline:6px solid #3a7a3a}
.mouse .mr.hit-right{background:#80b1d3!important;outline:6px solid #315f88}
.mouse .wheel.hit-wheel{background:#fdb462!important;outline:6px solid #9b5a14}
/* stage 2 */
.mouse-lab{display:grid;grid-template-columns:1fr 300px 1fr;gap:28px;align-items:center;max-width:900px;margin:auto}
.label-box{
  border:4px dashed var(--unit);border-radius:18px;background:#fff;padding:14px;
  min-height:64px;display:grid;place-items:center;text-align:center;font-weight:900
}
.label-box.filled{border-style:solid;background:var(--unit-soft)}
.tile-pool{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px}
.tile{
  border:4px solid var(--line);border-radius:16px;background:#fff;padding:11px 17px;font-weight:900;
  cursor:grab
}

/* stage 3 */
.sort-area{
  display:grid;grid-template-columns:1fr 1fr;gap:26px;max-width:900px;margin:auto
}
.mouse-card{
  border:4px solid var(--line);border-radius:25px;background:#fff;min-height:350px;
  display:grid;place-items:center;position:relative
}
.mouse-mini{transform:scale(.65);height:245px}
.symbol-badge{
  position:absolute;right:18px;top:18px;width:64px;height:64px;border-radius:50%;
  background:#fff;border:4px solid var(--unit);display:grid;place-items:center;font-size:35px
}
.drop-zone{
  margin-top:18px;border:4px dashed #9bb0c5;border-radius:20px;min-height:90px;
  display:grid;place-items:center;font-size:44px;background:#fbfdff
}
.drop-zone.filled{border-style:solid;border-color:var(--unit);background:var(--unit-soft)}
.mouse-token{
  border:4px solid var(--line);border-radius:22px;background:#fff;padding:12px 18px;
  display:grid;place-items:center;cursor:grab
}

/* stage 4 */
.surface-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;max-width:900px;margin:auto}
.surface-card{
  min-height:310px;border:4px solid var(--line);border-radius:25px;background:#fff;
  display:grid;place-items:center;position:relative;padding:18px
}
.surface-pic{
  width:190px;height:120px;border-radius:18px;display:grid;place-items:center;font-size:82px;
  box-shadow:0 5px 10px rgba(0,0,0,.10)
}
.mousepad{background:linear-gradient(145deg,#497ad6,#274c9b);border:5px solid #193970}
.wood{background:repeating-linear-gradient(10deg,#d6a369 0 14px,#c38e54 14px 28px);border:5px solid #8a5d30}
.glass{background:linear-gradient(135deg,rgba(190,235,250,.55),rgba(255,255,255,.9));border:5px solid #7db8cc}
.surface-card .mark{
  position:absolute;right:15px;top:15px;width:56px;height:56px;border-radius:50%;
  border:4px solid #9eb0c1;background:#fff;display:grid;place-items:center;font-size:33px;font-weight:900
}
.surface-card.good{border-color:var(--ok);background:#ebfff5}
.surface-card.bad{border-color:var(--bad);background:#fff0ee}
.surface-card.good .mark{border-color:var(--ok);color:var(--ok)}
.surface-card.bad .mark{border-color:var(--bad);color:var(--bad)}

/* stage 5 */
.hand-scene{
  max-width:900px;min-height:440px;margin:auto;border:3px solid var(--line);border-radius:26px;
  background:linear-gradient(#eaf7ff,#fff);position:relative;overflow:hidden
}
.handmouse{position:absolute;left:50%;top:72px;transform:translateX(-50%) scale(.78)}
.finger-token{
  position:absolute;width:82px;height:150px;border-radius:40px 40px 25px 25px;
  border:4px solid #9a6748;background:#efb78b;box-shadow:0 6px 0 #d58e62;
  display:grid;place-items:center;font-size:42px;cursor:grab
}
.finger-token.index{left:13%;bottom:35px}.finger-token.middle{right:13%;bottom:35px}
.finger-drop{
  position:absolute;width:100px;height:120px;border:4px dashed var(--unit);border-radius:28px;
  background:rgba(253,236,234,.8);top:112px;z-index:8
}
.fd1{left:36%}.fd2{right:36%}.finger-drop.filled{border-style:solid;background:#fde1dd}

/* final */
.stars{font-size:60px;text-align:center;margin:20px}
.final-summary{
  max-width:820px;margin:20px auto;padding:24px;border:4px solid var(--unit);
  border-radius:26px;background:var(--unit-soft);text-align:center;font-size:72px
}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:760px;margin:20px auto}
.face{min-height:140px;border:4px solid var(--line);border-radius:24px;background:#fff;font-size:70px}
.face.sel{border-color:var(--unit);background:var(--unit-soft)}
.actions{display:flex;justify-content:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.btn{border:0;border-radius:15px;padding:13px 22px;font-weight:900;font-size:19px}
.primary{background:var(--unit);color:#fff}.secondary{background:#eef3f8;border:2px solid #b9cbe0;color:var(--ink)}

/* help */
.modal{position:fixed;inset:0;background:rgba(15,35,55,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}
.modal.open{display:flex}
.modal-box{max-width:620px;background:#fff;border:4px solid #efc74f;border-radius:26px;padding:24px;text-align:center}
.modal-box .bighelp{font-size:90px}.modal-box p{font-size:22px;font-weight:900;line-height:1.4}
@media(max-width:800px){
  .grid4,.surface-grid,.sort-area{grid-template-columns:1fr 1fr}
  .mouse-lab{grid-template-columns:1fr}
  .faces{grid-template-columns:1fr}
}
</style>

<style id="nk-license-style">
.nk-license{max-width:1100px;margin:14px auto 24px;padding:10px 16px;text-align:center;font:13px/1.45 Arial,"Noto Sans",sans-serif;color:#4e657c}
.nk-license a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.nk-license .cc-badge{display:inline-block;margin:0 4px;padding:2px 7px;border:1px solid #8aa0b8;border-radius:6px;background:#fff;font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<main class="app">
<header class="top">
  <div><h1>Το ποντίκι</h1><small>Μάθημα 19</small></div>
  <div class="unit-badge">🖱️</div>
</header>
<nav class="path" id="path"></nav>
<section class="panel" id="panel"></section>
</main>

<div class="modal" id="helpModal">
 <div class="modal-box">
   <div class="bighelp" id="helpIcon">👆</div>
   <p id="helpText"></p>
   <div class="actions"><button class="btn secondary" id="listen">🔊</button><button class="btn primary" id="closeHelp">✓</button></div>
 </div>
</div>

<script>
(()=>{'use strict';
const panel=document.getElementById('panel'),path=document.getElementById('path');
const modal=document.getElementById('helpModal'),helpText=document.getElementById('helpText'),helpIcon=document.getElementById('helpIcon');
let step=0,completed=new Set(),selfChoice=null;
const total=6;
const help=[
 ['🖱️','Βρες και πάτησε το ποντίκι.'],
 ['👆','Σύρε τα τρία ονόματα στα σωστά μέρη.'],
 ['🔌','Σύρε το ποντίκι με καλώδιο στο 🔌 και το ασύρματο στο 📶.'],
 ['🖱️','Πάτησε τις επιφάνειες όπου μπορεί να δουλέψει σωστά το ποντίκι.'],
 ['✋','Βάλε το ένα δάχτυλο στο αριστερό πλήκτρο και το άλλο στο δεξί.'],
 ['⭐','Διάλεξε πώς νιώθεις.']
];
function speak(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='el-GR';u.rate=.84;speechSynthesis.speak(u)}
function head(n,icon){return `<div class="step-head"><h2>${n}. ${icon}</h2><button class="help" id="help">❔ Βοήθεια</button></div>`}
function feedback(){return '<div class="feedback" id="feedback"></div>'}
function fb(ok,t){const f=document.getElementById('feedback');f.className='feedback '+(ok?'good':'bad');f.textContent=t;speak(t)}
function complete(delay=850){completed.add(step);drawPath();setTimeout(()=>{if(step<total-1){step++;render()}},delay)}
function drawPath(){path.innerHTML='';for(let i=0;i<total;i++){const d=document.createElement('div');d.className='dot'+(i===step?' active':'')+(completed.has(i)?' done':'');d.textContent=completed.has(i)?'✓':i+1;path.appendChild(d)}}
function bindHelp(){document.getElementById('help').onclick=()=>{helpIcon.textContent=help[step][0];helpText.textContent=help[step][1];modal.classList.add('open')}}
document.getElementById('closeHelp').onclick=()=>modal.classList.remove('open');
document.getElementById('listen').onclick=()=>speak(helpText.textContent);

function mouse(cls=''){return `<div class="mouse ${cls}"><div class="ml"></div><div class="mr"></div><div class="wheel"></div></div>`}

/* 1 */
function r1(){return `${head(1,'👀 → 🖱️')}<div class="lesson-card"><span class="decor d1">⭐</span><span class="decor d2">✨</span><div class="grid4"><button class="choice" data-x="kbd"><span class="icon">⌨️</span></button><button class="choice" data-x="mouse"><span class="icon">🖱️</span></button><button class="choice" data-x="screen"><span class="icon">🖥️</span></button><button class="choice" data-x="sound"><span class="icon">🎧</span></button></div></div>${feedback()}`}
function b1(){document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.x==='mouse'){b.classList.add('ok');fb(true,'Μπράβο!');complete()}else{b.classList.add('no');fb(false,'Δοκίμασε ξανά.')}})}

/* 2 */
function r2(){return `${head(2,'🖱️')}<div class="lesson-card"><div class="mouse-lab"><div><div class="label-box" data-part="left">👈</div><div style="height:25px"></div><div class="label-box" data-part="wheel">↕️</div></div><div style="display:grid;place-items:center;padding-top:60px">${mouse()}</div><div><div class="label-box" data-part="right">👉</div></div></div><div class="tile-pool"><div class="tile" draggable="true" data-part="wheel">Ροδέλα</div><div class="tile" draggable="true" data-part="left">Αριστερό</div><div class="tile" draggable="true" data-part="right">Δεξί</div></div></div>${feedback()}`}
function b2(){let drag=null,n=0;document.querySelectorAll('.tile').forEach(t=>t.addEventListener('dragstart',()=>drag=t));document.querySelectorAll('.label-box').forEach(s=>{s.addEventListener('dragover',e=>e.preventDefault());s.addEventListener('drop',()=>{if(!drag)return;if(drag.dataset.part!==s.dataset.part){fb(false,'Δοκίμασε άλλη θέση.');return}s.textContent=drag.textContent;s.classList.add('filled');if(drag.dataset.part==='left')document.querySelector('.ml').classList.add('hit-left');if(drag.dataset.part==='right')document.querySelector('.mr').classList.add('hit-right');if(drag.dataset.part==='wheel')document.querySelector('.wheel').classList.add('hit-wheel');drag.remove();drag=null;n++;if(n===3){fb(true,'Τα βρήκες όλα!');complete(1000)}})})}

/* 3 - explicit sorting */
function r3(){
 return `${head(3,'🔌  /  📶')}
 <div class="lesson-card">
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:28px;max-width:900px;margin:auto">
     <div>
       <div class="mouse-card" id="wiredCard">
         <span class="symbol-badge">🔌</span>
         <div class="mouse-mini">${mouse()}</div>
       </div>
       <div class="drop-zone" data-kind="wired">🔌</div>
     </div>

     <div>
       <div class="mouse-card" id="wirelessCard">
         <span class="symbol-badge">📶</span>
         <div class="mouse-mini">${mouse('wireless')}</div>
       </div>
       <div class="drop-zone" data-kind="wireless">📶</div>
     </div>
   </div>

   <div class="tile-pool" style="margin-top:22px">
     <div class="mouse-token" draggable="true" data-kind="wired">
       <div style="transform:scale(.34);height:105px">${mouse()}</div>
     </div>
     <div class="mouse-token" draggable="true" data-kind="wireless">
       <div style="transform:scale(.34);height:105px">${mouse('wireless')}</div>
     </div>
   </div>
 </div>
 ${feedback()}`;
}

function b3(){
 let drag=null,n=0;
 document.querySelectorAll('.mouse-token').forEach(t=>{
   t.addEventListener('dragstart',()=>drag=t);
 });
 document.querySelectorAll('.drop-zone').forEach(z=>{
   z.addEventListener('dragover',e=>e.preventDefault());
   z.addEventListener('drop',()=>{
     if(!drag)return;
     if(drag.dataset.kind!==z.dataset.kind){
       fb(false,'Δοκίμασε το άλλο πλαίσιο.');
       return;
     }
     z.innerHTML=drag.innerHTML;
     z.classList.add('filled');
     drag.remove();
     drag=null;
     n++;
     if(n===2){
       fb(true,'Μπράβο!');
       complete(1000);
     }
   });
 });
}

/* 4 - recognizable mousepad / wooden desk / glass top */
function r4(){return `${head(4,'🖱️ ↓')}<div class="lesson-card"><div class="surface-grid"><button class="surface-card" data-good="1"><span class="mark">?</span><div class="surface-pic mousepad">🖱️</div></button><button class="surface-card" data-good="1"><span class="mark">?</span><div class="surface-pic wood">🖱️</div></button><button class="surface-card" data-good="0"><span class="mark">?</span><div class="surface-pic glass">🖱️</div></button></div></div>${feedback()}`}
function b4(){let correct=0;document.querySelectorAll('.surface-card').forEach(b=>b.onclick=()=>{if(b.dataset.good==='1'&&!b.classList.contains('good')){b.classList.add('good');b.querySelector('.mark').textContent='✓';correct++;if(correct===2){fb(true,'Σωστά!');complete(1000)}}else if(b.dataset.good==='0'){b.classList.add('bad');b.querySelector('.mark').textContent='✕';fb(false,'Δοκίμασε άλλη επιφάνεια.')}})}

/* 5 */
function r5(){return `${head(5,'✋ + 🖱️')}<div class="lesson-card"><div class="hand-scene"><div class="handmouse">${mouse()}</div><div class="finger-drop fd1" data-f="index"></div><div class="finger-drop fd2" data-f="middle"></div><div class="finger-token index" draggable="true" data-f="index">☝️</div><div class="finger-token middle" draggable="true" data-f="middle">🖕</div></div></div>${feedback()}`}
function b5(){let drag=null,n=0;document.querySelectorAll('.finger-token').forEach(f=>f.addEventListener('dragstart',()=>drag=f));document.querySelectorAll('.finger-drop').forEach(t=>{t.addEventListener('dragover',e=>e.preventDefault());t.addEventListener('drop',()=>{if(!drag)return;if(drag.dataset.f!==t.dataset.f){fb(false,'Δοκίμασε το άλλο δάχτυλο.');return}t.textContent=drag.textContent;t.classList.add('filled');drag.remove();drag=null;n++;if(n===2){fb(true,'Μπράβο!');complete(1000)}})})}

/* 6 */
function r6(){return `${head(6,'⭐')}<div class="final-summary">🖱️　👆　🔌　📶</div><div class="faces"><button class="face" data-v="1">🙂</button><button class="face" data-v="2">😊</button><button class="face" data-v="3">🤩</button></div><div class="actions"><button class="btn primary" id="finish">✓</button><button class="btn secondary" id="restart">↻ Από την αρχή</button></div>${feedback()}`}
function b6(){document.querySelectorAll('.face').forEach(b=>b.onclick=()=>{document.querySelectorAll('.face').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selfChoice=b.dataset.v});document.getElementById('restart').onclick=()=>{step=0;completed.clear();selfChoice=null;render()};document.getElementById('finish').onclick=()=>{if(!selfChoice){fb(false,'Διάλεξε ένα πρόσωπο.');return}completed.add(step);drawPath();fb(true,'Μπράβο! ⭐')}}

function render(){drawPath();const views=[r1,r2,r3,r4,r5,r6],bind=[b1,b2,b3,b4,b5,b6];panel.innerHTML=views[step]();bindHelp();bind[step]()}
render();
})();
</script>
