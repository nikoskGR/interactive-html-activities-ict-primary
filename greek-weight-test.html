<!doctype html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Greek font-weight test</title>
<style>
body{margin:0;background:#f5f7fb;color:#24324a;font-family:Inter,"Segoe UI",Arial,sans-serif}
main{max-width:1050px;margin:28px auto;padding:24px;background:#fff;border:1px solid #d9e0eb;border-radius:18px}
h1{margin:0 0 8px}.note{color:#59677d;margin-bottom:22px}.row{padding:15px 0;border-top:1px solid #e2e7ef}.label{font:700 13px/1.3 Arial,sans-serif;color:#64728a;margin-bottom:6px}.sample{font-size:24px;line-height:1.35}.seg{font-family:"Segoe UI",Arial,sans-serif}.arial{font-family:Arial,sans-serif}
</style>
</head>
<body><main>
<h1>Δοκιμή ελληνικών χαρακτήρων ανά βάρος γραμματοσειράς</h1>
<p class="note">Έλεγξε ειδικά τα ω και ώ στις σειρές με βάρη 650, 700, 750, 850, 900 και 950.</p>
<div id="rows"></div>
<script>
const text='ω ώ Ερωτήματα δεδομένων Διατυπώνω Ξεχώρισε ερωτήματα ζώο πώς μπορώ';
const weights=[400,500,600,650,700,750,800,850,900,950];
const rows=document.getElementById('rows');
for(const w of weights){
  const d=document.createElement('div'); d.className='row';
  d.innerHTML=`<div class="label">Inter stack · font-weight: ${w}</div><div class="sample" style="font-weight:${w}">${text}</div>`;
  rows.appendChild(d);
}
for(const w of [650,700,750,850,900,950]){
  const d=document.createElement('div'); d.className='row';
  d.innerHTML=`<div class="label">Segoe UI stack · font-weight: ${w}</div><div class="sample seg" style="font-weight:${w}">${text}</div>`;
  rows.appendChild(d);
}
</script>
</main></body></html>
